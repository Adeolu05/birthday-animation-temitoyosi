<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Surprise for Temitoyosi!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Playfair+Display:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* Preloader */
        .preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
        }
        
        .preloader.hidden {
            opacity: 0;
            visibility: hidden;
        }
        
        .loader {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left: 4px solid #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        .loader-text {
            position: absolute;
            margin-top: 120px;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-weight: 300;
            letter-spacing: 2px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: 
                linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%),
                radial-gradient(circle at top right, rgba(255, 215, 0, 0.1) 0%, transparent 60%),
                radial-gradient(circle at bottom left, rgba(255, 105, 180, 0.1) 0%, transparent 60%);
            background-attachment: fixed;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            cursor: none;
        }
        
        /* Custom cursor */
        .cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            background: linear-gradient(45deg, #ffd700, #ff69b4);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transition: transform 0.1s ease;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        
        .cursor-trail {
            position: fixed;
            width: 8px;
            height: 8px;
            background: rgba(255, 215, 0, 0.6);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9997;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }
        
        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            width: 100%;
        }
        
        .birthday-header {
            margin-bottom: 2rem;
            animation: fadeInDown 1s ease-out;
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.8rem, 6vw, 5rem);
            font-weight: 900;
            background: linear-gradient(45deg, #ffd700, #ff69b4, #87ceeb, #98fb98, #ffd700);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease-in-out infinite, bounceIn 1.5s ease-out, textGlow 2s ease-in-out infinite alternate;
            margin-bottom: 1rem;
            position: relative;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        h1::before {
            content: '🎉 Happy Birthday, Temitoyosi! 🎉';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255, 215, 0, 0.3), rgba(255, 105, 180, 0.3), rgba(135, 206, 235, 0.3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: blur(3px);
            z-index: -1;
            animation: glowPulse 3s ease-in-out infinite;
        }
        
        .subtitle {
            font-size: 1.4rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 0.8rem;
            animation: fadeInUp 1s ease-out 0.3s both;
        }
        
        .intro-text {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 400;
            margin-bottom: 3rem;
            animation: fadeInUp 1s ease-out 0.6s both;
        }
        
        .image-container {
            margin: 3rem 0;
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            animation: fadeInUp 1s ease-out 0.9s both;
        }
        
        .image-wrapper {
            position: relative;
            overflow: hidden;
            border-radius: 25px;
            box-shadow: 
                0 25px 50px rgba(0,0,0,0.4),
                0 0 0 1px rgba(255, 255, 255, 0.1),
                inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
        }
        
        .image-wrapper:hover {
            transform: translateY(-15px) scale(1.08) rotateY(5deg);
            box-shadow: 
                0 40px 80px rgba(0,0,0,0.6),
                0 0 30px rgba(255, 215, 0, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.2);
        }
        
        .image-wrapper::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            transition: all 0.6s ease;
            opacity: 0;
        }
        
        .image-wrapper:hover::after {
            animation: shimmer 1.5s ease-in-out;
            opacity: 1;
        }
        
        .image-container img {
            max-width: 100%;
            width: 350px;
            height: 350px;
            object-fit: cover;
            border-radius: 20px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            transition: all 0.4s ease;
        }
        
        .image-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(255, 215, 0, 0.2), rgba(255, 105, 180, 0.2));
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 20px;
        }
        
        .image-wrapper:hover::before {
            opacity: 1;
        }
        
        .message-section {
            margin: 3rem 0;
            animation: fadeInUp 1s ease-out 1.2s both;
        }
        
        .surprise-message {
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 2rem;
            font-weight: 400;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .surprise-link {
            display: inline-block;
            font-size: 1.4rem;
            font-weight: 700;
            padding: 22px 50px;
            cursor: pointer;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 50%, #ffa8a8 100%);
            color: white;
            border: none;
            border-radius: 60px;
            text-decoration: none;
            box-shadow: 
                0 15px 35px rgba(255, 107, 107, 0.4),
                0 5px 15px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 2px;
            backdrop-filter: blur(10px);
        }
        
        .surprise-link::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.1));
            border-radius: 60px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .surprise-link:hover::after {
            opacity: 1;
        }
        
        .surprise-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }
        
        .surprise-link:hover::before {
            left: 100%;
        }
        
        .surprise-link:hover {
            transform: translateY(-5px) scale(1.08);
            box-shadow: 
                0 25px 50px rgba(255, 107, 107, 0.6),
                0 0 30px rgba(255, 107, 107, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            animation: buttonPulse 0.6s ease-in-out;
        }
        
        .surprise-link:active {
            transform: translateY(-2px) scale(1.04);
        }
        
        /* Magnetic effect for surprise link */
        .surprise-link {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        /* Floating particles animation */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffd700;
            border-radius: 50%;
            animation: float 15s infinite linear;
            opacity: 0.7;
        }
        
        .particle:nth-child(2n) { background: #ff69b4; }
        .particle:nth-child(3n) { background: #87ceeb; }
        .particle:nth-child(4n) { background: #98fb98; }
        
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        @keyframes textGlow {
            0% {
                filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.8));
            }
            100% {
                filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8)) 
                        drop-shadow(0 0 30px rgba(255, 105, 180, 0.6));
            }
        }
        
        @keyframes glowPulse {
            0%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.02);
            }
        }
        
        @keyframes shimmer {
            0% {
                transform: translateX(-100%) translateY(-100%) rotate(45deg);
            }
            100% {
                transform: translateX(100%) translateY(100%) rotate(45deg);
            }
        }
        
        @keyframes buttonPulse {
            0% { transform: translateY(-5px) scale(1.08); }
            50% { transform: translateY(-7px) scale(1.12); }
            100% { transform: translateY(-5px) scale(1.08); }
        }
        
        @keyframes morphing {
            0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            .image-container {
                gap: 20px;
            }
            
            .image-container img {
                width: 280px;
                height: 280px;
            }
            
            .surprise-link {
                font-size: 1.1rem;
                padding: 15px 35px;
            }
        }
        
        @media (max-width: 480px) {
            .image-container img {
                width: 250px;
                height: 250px;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
            
            .intro-text {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Preloader -->
    <div class="preloader" id="preloader">
        <div class="loader"></div>
        <div class="loader-text">Loading Birthday Magic...</div>
    </div>

    <!-- Custom Cursor -->
    <div class="cursor" id="cursor"></div>
    
    <!-- Floating Particles -->
    <div class="particles">
        <div class="particle" style="left: 10%; animation-delay: 0s; animation-duration: 12s;"></div>
        <div class="particle" style="left: 20%; animation-delay: 2s; animation-duration: 15s;"></div>
        <div class="particle" style="left: 30%; animation-delay: 4s; animation-duration: 18s;"></div>
        <div class="particle" style="left: 40%; animation-delay: 1s; animation-duration: 14s;"></div>
        <div class="particle" style="left: 50%; animation-delay: 3s; animation-duration: 16s;"></div>
        <div class="particle" style="left: 60%; animation-delay: 5s; animation-duration: 13s;"></div>
        <div class="particle" style="left: 70%; animation-delay: 2.5s; animation-duration: 17s;"></div>
        <div class="particle" style="left: 80%; animation-delay: 4.5s; animation-duration: 19s;"></div>
        <div class="particle" style="left: 90%; animation-delay: 1.5s; animation-duration: 11s;"></div>
        <div class="particle" style="left: 15%; animation-delay: 6s; animation-duration: 20s;"></div>
        <div class="particle" style="left: 35%; animation-delay: 7s; animation-duration: 14s;"></div>
        <div class="particle" style="left: 55%; animation-delay: 8s; animation-duration: 16s;"></div>
        <div class="particle" style="left: 75%; animation-delay: 9s; animation-duration: 12s;"></div>
        <div class="particle" style="left: 85%; animation-delay: 10s; animation-duration: 18s;"></div>
    </div>

    <div class="container">
        <div class="birthday-header">
            <h1>🎉 Happy Birthday, Temitoyosi! 🎉</h1>
            <p class="subtitle">Celebrating another year of awesome!</p>
            <p class="intro-text">Here are some cherished moments to remember this special day...</p>
        </div>

        <div class="image-container">
            <div class="image-wrapper">
                <img src="../Temitoyosi/img/image1.jfif" alt="A beautiful moment with Temitoyosi">
            </div>
            <div class="image-wrapper">
                <img src="../Temitoyosi/img/image2.jfif" alt="Another wonderful memory with Temitoyosi">
            </div>
        </div>

        <div class="message-section">
            <p class="surprise-message">✨ But your <em>real</em> surprise is just one click away... ✨</p>
            <a href="../Temitoyosi/cake.html" class="surprise-link">🎂 Unwrap Your Surprise! 🎂</a>
        </div>
    </div>

    <script>
        // Preloader
        window.addEventListener('load', function() {
            const preloader = document.getElementById('preloader');
            setTimeout(() => {
                preloader.classList.add('hidden');
                setTimeout(() => {
                    preloader.style.display = 'none';
                }, 500);
            }, 2000);
        });

        // Custom Cursor
        const cursor = document.getElementById('cursor');
        const trails = [];
        const trailCount = 5;

        // Create cursor trails
        for (let i = 0; i < trailCount; i++) {
            const trail = document.createElement('div');
            trail.className = 'cursor-trail';
            document.body.appendChild(trail);
            trails.push({
                element: trail,
                x: 0,
                y: 0
            });
        }

        let mouseX = 0, mouseY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            cursor.style.left = mouseX - 10 + 'px';
            cursor.style.top = mouseY - 10 + 'px';
        });

        // Animate cursor trails
        function animateTrails() {
            trails.forEach((trail, index) => {
                const delay = (index + 1) * 50;
                setTimeout(() => {
                    trail.x += (mouseX - trail.x) * 0.1;
                    trail.y += (mouseY - trail.y) * 0.1;
                    trail.element.style.left = trail.x - 4 + 'px';
                    trail.element.style.top = trail.y - 4 + 'px';
                    trail.element.style.opacity = 1 - (index * 0.2);
                }, delay);
            });
            requestAnimationFrame(animateTrails);
        }
        animateTrails();

        // Interactive elements
        const imageWrappers = document.querySelectorAll('.image-wrapper');
        const surpriseLink = document.querySelector('.surprise-link');

        // Image hover effects with magnetic attraction
        imageWrappers.forEach(wrapper => {
            wrapper.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-15px) scale(1.08) rotateY(5deg)';
                cursor.style.transform = 'scale(1.5)';
            });

            wrapper.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0) scale(1) rotateY(0deg)';
                cursor.style.transform = 'scale(1)';
            });

            wrapper.addEventListener('mousemove', function(e) {
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = (y - centerY) / 10;
                const rotateY = (centerX - x) / 10;
                
                this.style.transform = `translateY(-15px) scale(1.08) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });
        });

        // Surprise link magnetic effect
        surpriseLink.addEventListener('mousemove', function(e) {
            const rect = this.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            this.style.transform = `translate(${x * 0.1}px, ${y * 0.1}px) translateY(-5px) scale(1.08)`;
        });

        surpriseLink.addEventListener('mouseleave', function() {
            this.style.transform = 'translate(0px, 0px) translateY(0px) scale(1)';
        });

        // Enhanced click effect
        surpriseLink.addEventListener('click', function(e) {
            // Create ripple effect
            const ripple = document.createElement('span');
            const rect = this.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = e.clientX - rect.left - size / 2;
            const y = e.clientY - rect.top - size / 2;
            
            ripple.style.cssText = `
                position: absolute;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.6);
                transform: scale(0);
                animation: ripple 0.6s linear;
                left: ${x}px;
                top: ${y}px;
                width: ${size}px;
                height: ${size}px;
            `;
            
            this.appendChild(ripple);
            
            setTimeout(() => {
                ripple.remove();
            }, 600);
        });

        // Add ripple animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple {
                to {
                    transform: scale(2);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Parallax effect for background
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            document.body.style.backgroundPositionX = `${50 + x * 5}%`;
            document.body.style.backgroundPositionY = `${50 + y * 5}%`;
        });

        // Add confetti burst on page load
        function createConfetti() {
            const colors = ['#ffd700', '#ff69b4', '#87ceeb', '#98fb98', '#ffa500'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.style.cssText = `
                    position: fixed;
                    width: 10px;
                    height: 10px;
                    background: ${colors[Math.floor(Math.random() * colors.length)]};
                    left: ${Math.random() * 100}%;
                    top: -10px;
                    border-radius: 50%;
                    pointer-events: none;
                    z-index: 1000;
                    animation: confettiFall ${Math.random() * 2 + 3}s linear forwards;
                `;
                document.body.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 5000);
            }
        }

        // Add confetti animation
        const confettiStyle = document.createElement('style');
        confettiStyle.textContent = `
            @keyframes confettiFall {
                to {
                    transform: translateY(100vh) rotate(720deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(confettiStyle);

        // Trigger confetti after preloader
        setTimeout(() => {
            createConfetti();
        }, 2500);
    </script>

</body>
</html>
