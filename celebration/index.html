<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0806">
  <title>Happy 21st Birthday, Temitoyosi</title>
  <meta name="description" content="Twenty-one candles, one wish. From your friend, David.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="A Celebration">
  <meta property="og:title" content="Happy 21st Birthday, Temitoyosi">
  <meta property="og:description" content="Twenty-one candles, one wish. From your friend, David.">
  <meta property="og:url" content="https://adeolu05.github.io/birthday-animation-temitoyosi/celebration/">
  <meta property="og:image" content="https://adeolu05.github.io/birthday-animation-temitoyosi/celebration/og-image.jpg">
  <meta property="og:image:secure_url" content="https://adeolu05.github.io/birthday-animation-temitoyosi/celebration/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A gold-trimmed garnet and ivory birthday cake beside the name Temitoyosi">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Happy 21st Birthday, Temitoyosi">
  <meta name="twitter:description" content="Twenty-one candles, one wish. From your friend, David.">
  <meta name="twitter:image" content="https://adeolu05.github.io/birthday-animation-temitoyosi/celebration/og-image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="An animated birthday scene"></canvas>
  <div id="vignette"></div>
  <div id="flash"></div>
  <div id="grain"></div>

  <div id="loader" class="screen">
    <div class="rule-loader"><span></span></div>
  </div>

  <div id="intro" class="screen hidden">
    <p class="label">A celebration of</p>
    <h1 id="intro-name"></h1>
    <div class="rule"></div>
    <button id="start" class="text-btn">Begin</button>
    <p class="fine">Best experienced with sound</p>
  </div>

  <div id="caption" class="caption" aria-live="polite"></div>

  <div id="wish" class="wish hidden">
    <p id="wish-text"></p>
    <div id="blow-controls" class="hidden">
      <div class="row">
        <button id="blow" class="text-btn">Blow out the candles</button>
        <button id="mic" class="text-btn quiet">Use microphone</button>
      </div>
      <div id="meter" class="meter hidden"><span></span></div>
      <p class="fine" id="blow-hint">or simply tap the cake</p>
    </div>
  </div>

  <div id="finale" class="card hidden" role="dialog" aria-labelledby="final-name">
    <button class="close" id="close-card" aria-label="Hide letter">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
    </button>
    <div class="card-inner">
      <div class="monogram" id="monogram"></div>
      <p class="label" id="final-label">Happy Birthday</p>
      <h2 id="final-name"></h2>
      <div class="rule small"></div>
      <p id="final-message"></p>
      <p id="final-from" class="from"></p>
      <div class="row">
        <button id="more" class="text-btn">Light the sky</button>
        <button id="replay" class="text-btn quiet">Watch again</button>
      </div>
    </div>
  </div>

  <button id="show-card" class="text-btn floating hidden">Read the letter</button>
  <button id="mute" class="icon-btn" aria-label="Mute sound">
    <svg class="on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.4 7.4 0 0 1 0 10.4"/></svg>
    <svg class="off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
  </button>

  <div id="lightbox" class="lightbox hidden"><img alt="A photograph"></div>

  <div id="fallback" class="screen hidden">
    <p class="label">Happy Birthday</p>
    <p class="fine">This browser can't display the 3D celebration.</p>
    <a class="text-btn" href="../Temitoyosi/index.html">Open the classic version</a>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
